<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>3D Checkers — Live Match</title>
<style>
  :root {
    --gold: #FFD700;
    --text: #f0f0e8;
    --text-muted: #aaa;
    --board-bg: #1a3d10;
  }
  * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--board-bg);
    color: var(--text);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Top bar ─────────────────────────────────────────────── */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 52px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 10px;
    background: rgba(0,0,0,0.55);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    z-index: 20;
    backdrop-filter: blur(6px);
  }
  #topbar button {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
    color: var(--text); border-radius: 8px; padding: 7px 10px;
    font-size: 0.8rem; cursor: pointer;
  }
  #topbar button:hover { background: rgba(255,255,255,0.16); }
  #topbar button.danger {
    border-color: rgba(229,57,53,0.45); color: #FF8A80;
    background: rgba(229,57,53,0.12);
  }
  #topbar button.danger:hover { background: rgba(229,57,53,0.22); }
  #room-code { font-family: monospace; color: var(--gold); font-weight: 700; }
  .pill {
    font-size: 0.72rem; padding: 3px 9px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.15); white-space: nowrap;
  }
  .pill-live { color: #6CE39A; border-color: rgba(108,227,154,0.4); background: rgba(108,227,154,0.08); }
  .pill-wait { color: #FFD180; border-color: rgba(255,209,128,0.4); background: rgba(255,209,128,0.08); }
  #topbar .spacer { flex: 1; }
  #turn-pill { font-weight: 700; }

  /* ── Player strip (compact, doesn't eat board width) ───────── */
  #players {
    position: fixed; top: 52px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 6px 12px;
    font-size: 0.78rem;
    z-index: 15;
    pointer-events: none;
  }
  .pcard {
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 4px 10px 4px 6px;
  }
  .pcard.active { border-color: var(--gold); box-shadow: 0 0 10px rgba(255,215,0,0.25); }
  .pdot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
  .pdot.black { background: radial-gradient(circle at 35% 35%, #555, #111); border: 1px solid #333; }
  .pdot.white { background: radial-gradient(circle at 35% 35%, #fff, #c8b87a); border: 1px solid #b8960c; }

  /* ── Board ───────────────────────────────────────────────── */
  #canvas-wrap {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game-canvas {
    width: 100%; height: 100%;
    display: block;
    touch-action: none; /* we own all touch gestures for piece picking */
    cursor: pointer;
  }

  /* ── Overlays ────────────────────────────────────────────── */
  #overlay {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.7);
    z-index: 30;
    text-align: center;
    padding: 24px;
  }
  #overlay.show { display: flex; }
  #overlay .card {
    background: linear-gradient(160deg, #1a3d10 0%, #0d1f08 100%);
    border: 1px solid rgba(255,215,0,0.3);
    border-radius: 18px; padding: 28px 30px;
    max-width: 360px; width: 100%;
  }
  #overlay h2 { color: var(--gold); font-size: 1.4rem; margin-bottom: 8px; }
  #overlay p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 18px; }
  #overlay .room-big {
    font-family: monospace; font-size: 1.8rem; letter-spacing: 0.25em;
    color: var(--gold); font-weight: 700; margin: 10px 0 20px;
  }
  #overlay button {
    background: var(--gold); color: #1a2e0f; border: none;
    border-radius: 10px; padding: 10px 22px; font-weight: 700;
    font-size: 0.9rem; cursor: pointer;
  }

  #confirm-overlay {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.75);
    z-index: 35;
    text-align: center;
    padding: 24px;
  }
  #confirm-overlay.show { display: flex; }
  #confirm-overlay .card {
    background: linear-gradient(160deg, #2a1010 0%, #1a0a0a 100%);
    border: 1px solid rgba(255,138,128,0.35);
    border-radius: 18px; padding: 26px 28px;
    max-width: 340px; width: 100%;
  }
  #confirm-overlay h2 { color: #FF8A80; font-size: 1.2rem; margin-bottom: 8px; }
  #confirm-overlay p { color: var(--text-muted); font-size: 0.86rem; margin-bottom: 18px; }
  #confirm-overlay button.ghost {
    background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 10px; padding: 10px 18px; font-size: 0.88rem; cursor: pointer;
  }
  #confirm-overlay button.danger-solid {
    background: #e53935; color: #fff; border: none;
    border-radius: 10px; padding: 10px 18px; font-weight: 700; font-size: 0.88rem; cursor: pointer;
  }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto 14px;
    border: 3px solid rgba(255,255,255,0.2); border-top-color: var(--gold);
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px; padding: 9px 20px;
    font-size: 0.85rem; z-index: 40; opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

  <div id="topbar">
    <button id="btn-lobby">← Lobby</button>
    <button id="btn-leave" class="danger">Leave Match</button>
    <span id="room-code">—</span>
    <span id="variant-pill" class="pill">—</span>
    <span id="status-pill" class="pill pill-wait">Connecting…</span>
    <div class="spacer"></div>
    <span id="turn-pill" class="pill">—</span>
  </div>

  <div id="players">
    <div id="p-black" class="pcard"><span class="pdot black"></span><span id="p-black-name">—</span></div>
    <div id="p-white" class="pcard"><span class="pdot white"></span><span id="p-white-name">—</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game-canvas"></canvas>
  </div>

  <div id="overlay" class="show">
    <div class="card">
      <div class="spinner"></div>
      <h2>Loading match…</h2>
      <p id="overlay-sub">Connecting to room</p>
    </div>
  </div>

  <div id="confirm-overlay">
    <div class="card">
      <h2 id="confirm-title">Leave this match?</h2>
      <p id="confirm-sub">Your opponent will win and take the pot. This can't be undone.</p>
      <div style="display:flex; gap:10px; justify-content:center;">
        <button id="confirm-cancel" class="ghost">Stay</button>
        <button id="confirm-ok" class="danger-solid">Leave Match</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Three.js was removed when the board moved from 3D to flat 2D Canvas
       rendering — Renderer2D.js needs no external 3D library. -->
  <!-- Supabase JS UMD build, so this static page can talk to the DB directly -->
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script type="module">
    import { GameEngine } from './js/GameEngine.js';
    import { Renderer2D } from './js/Renderer2D.js';
    import { THEMES } from './js/Modules.js';

    // ── Read config from the URL the opener window built for us ──────────
    const params = new URLSearchParams(window.location.search);
    const contestId    = params.get('contestId');
    const supabaseUrl  = params.get('supabaseUrl');
    const supabaseKey  = params.get('supabaseKey');
    const myUserId     = params.get('userId');
    const lobbyUrl     = params.get('lobbyUrl') || '/dashboard/checkers';

    const $ = (sel) => document.querySelector(sel);
    const overlay        = $('#overlay');
    const overlaySub     = $('#overlay-sub');
    const confirmOverlay = $('#confirm-overlay');
    const confirmTitle   = $('#confirm-title');
    const confirmSub     = $('#confirm-sub');
    const statusPill     = $('#status-pill');
    const turnPill       = $('#turn-pill');
    const roomCodeEl     = $('#room-code');
    const variantPill    = $('#variant-pill');
    const toastEl        = $('#toast');
    const canvas         = $('#game-canvas');
    const btnLobby       = $('#btn-lobby');
    const btnLeave       = $('#btn-leave');

    let hasLeftOrEnded = false; // guards against double-firing leave logic

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    function showOverlay(title, sub, withCloseButton) {
      overlay.querySelector('h2').textContent = title;
      overlaySub.textContent = sub || '';
      const old = overlay.querySelector('button');
      if (old) old.remove();
      if (withCloseButton) {
        const btn = document.createElement('button');
        btn.textContent = 'Back to Lobby';
        btn.onclick = () => goToLobby();
        overlay.querySelector('.card').appendChild(btn);
      }
      overlay.classList.add('show');
    }
    function hideOverlay() { overlay.classList.remove('show'); }

    // "Lobby" just navigates back — it does NOT end the match. The match
    // keeps running for both players; this tab/window simply returns to
    // the lobby list. (window.close() used to be here, but most mobile
    // browsers block closing a tab that wasn't opened as a true popup —
    // navigating is the reliable option everywhere.)
    function goToLobby() {
      window.location.href = lobbyUrl;
    }
    btnLobby.addEventListener('click', goToLobby);

    if (!contestId || !supabaseUrl || !supabaseKey) {
      showOverlay('Missing match info', 'This window was not opened correctly from the lobby.', true);
      throw new Error('play.html: missing required query params');
    }

    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey, {
      auth: { persistSession: true, autoRefreshToken: true },
    });

    let contest = null;
    let players = [];
    let engine = null;
    let renderer = null;
    let myPlayer = null;
    let oppPlayer = null;
    let selected = null; // {row, col}

    // ── Leave match ───────────────────────────────────────────────────
    // Calls the leave_checkers_contest RPC. If the contest was still
    // 'open' this cancels+refunds; if booked/in_progress it forfeits the
    // pot to the opponent. Safe to call more than once — the RPC itself
    // guards against acting on an already-finished contest.
    async function callLeaveRpc() {
      if (hasLeftOrEnded) return;
      hasLeftOrEnded = true;
      try {
        await supabase.rpc('leave_checkers_contest', {
          p_contest_id: contestId,
          p_user_id: myUserId,
        });
      } catch (err) {
        console.error('leave_checkers_contest failed', err);
      }
    }

    // Fired when the window/tab is actually closing. A normal async
    // supabase.rpc() call can be aborted mid-flight when the page unloads,
    // so for THIS path specifically we use fetch(..., {keepalive:true}),
    // which browsers guarantee will still be sent after the page is gone.
    // We still need an access token for the RLS-protected RPC call.
    function leaveOnUnload() {
      if (hasLeftOrEnded) return;
      hasLeftOrEnded = true;
      try {
        supabase.auth.getSession().then(({ data }) => {
          const token = data?.session?.access_token;
          if (!token) return;
          fetch(`${supabaseUrl}/rest/v1/rpc/leave_checkers_contest`, {
            method: 'POST',
            keepalive: true,
            headers: {
              'Content-Type': 'application/json',
              apikey: supabaseKey,
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ p_contest_id: contestId, p_user_id: myUserId }),
          }).catch(() => {});
        });
      } catch (err) {
        // best-effort only — nothing more we can do once the page is closing
      }
    }

    btnLeave.addEventListener('click', () => {
      if (!contest) return;
      if (contest.status === 'open') {
        confirmTitle.textContent = 'Cancel this match?';
        confirmSub.textContent = contest.entry_fee_cents > 0
          ? 'Your stake will be refunded.'
          : 'No opponent has joined yet.';
      } else {
        confirmTitle.textContent = 'Leave this match?';
        confirmSub.textContent = contest.entry_fee_cents > 0
          ? 'Your opponent will win and take the pot. This can\u2019t be undone.'
          : 'Your opponent will be marked the winner. This can\u2019t be undone.';
      }
      confirmOverlay.classList.add('show');
    });
    $('#confirm-cancel').addEventListener('click', () => confirmOverlay.classList.remove('show'));
    $('#confirm-ok').addEventListener('click', async () => {
      confirmOverlay.classList.remove('show');
      await callLeaveRpc();
      goToLobby();
    });

    // Best-effort: if the user closes the tab/window instead of clicking
    // "Leave Match", still record it as a forfeit so the opponent isn't
    // left waiting on a match that will never continue.
    window.addEventListener('pagehide', leaveOnUnload);

    async function loadContestAndPlayers() {
      const [contestRes, playersRes] = await Promise.all([
        supabase.from('checkers_contests').select('*').eq('id', contestId).single(),
        supabase.from('checkers_contest_players').select('*, profiles(username)').eq('contest_id', contestId),
      ]);
      if (contestRes.data) contest = contestRes.data;
      if (playersRes.data) players = playersRes.data;
      myPlayer  = players.find(p => p.user_id === myUserId) || null;
      oppPlayer = players.find(p => p.user_id !== myUserId) || null;
    }

    function renderHeader() {
      if (!contest) return;
      roomCodeEl.textContent = contest.room_code;
      variantPill.textContent = contest.variant === 'russian' ? 'Russian' : 'English';

      btnLeave.style.display = (contest.status === 'completed' || contest.status === 'cancelled') ? 'none' : '';

      if (contest.status === 'open') {
        statusPill.textContent = 'Waiting for opponent…';
        statusPill.className = 'pill pill-wait';
      } else if (contest.status === 'cancelled') {
        statusPill.textContent = 'Cancelled';
        statusPill.className = 'pill pill-wait';
      } else if (contest.status === 'completed') {
        statusPill.textContent = contest.forfeited_by ? 'Forfeited' : 'Finished';
        statusPill.className = 'pill pill-wait';
      } else {
        statusPill.textContent = 'Live';
        statusPill.className = 'pill pill-live';
      }

      $('#p-black-name').textContent =
        (myPlayer?.color === 'black' ? myPlayer : oppPlayer)?.profiles?.username ?? '—';
      $('#p-white-name').textContent =
        (myPlayer?.color === 'white' ? myPlayer : oppPlayer)?.profiles?.username ?? '—';
    }

    function renderTurn(turn) {
      turnPill.textContent = turn === myPlayer?.color ? 'Your turn' : "Opponent's turn";
      $('#p-black').classList.toggle('active', turn === 'black');
      $('#p-white').classList.toggle('active', turn === 'white');
    }

    // Guards re-entrancy while we wait for make_checkers_move() to resolve,
    // so a fast double-click can't fire two RPC calls for the same move.
    let moveInFlight = false;

    function mountEngine() {
      if (engine || !contest) return;
      if (contest.status === 'open' || contest.status === 'completed' || contest.status === 'cancelled') return;

      const themeKey = contest.theme || 'classic';
      const theme = { id: themeKey, ...THEMES[themeKey] };

      engine = new GameEngine({
        gameType: contest.variant,
        boardSize: 8,
        themePreset: themeKey,
        players: { black: null, white: null },
      });

      renderer = new Renderer2D(canvas, theme);

      // NOTE: we intentionally do NOT drive the rendered board off
      // engine.bus events here. The engine is used purely as a local rules
      // validator (legal moves, capture chains, promotion, game-over
      // detection) — the board that actually gets *rendered* always comes
      // from the server's board_state/turn columns, applied in
      // applyServerState() below. This is what makes the two players'
      // boards converge: both sides render the same authoritative state
      // instead of two independent local simulations that never talk to
      // each other.

      if (contest.board_state) {
        // Resuming a match already in progress (e.g. tab reload).
        engine.board = contest.board_state;
        engine.turn  = contest.turn || 'black';
        engine.status = 'playing';
        engine.moveCount = contest.move_count || 0;
        renderer.syncPieces(engine.board);
        renderTurn(engine.turn);
      } else {
        // First player to mount starts the canonical board and writes it to
        // the server immediately, so the engine's starting layout becomes
        // the shared source of truth rather than each tab silently
        // generating its own copy. Both players' tabs run this same branch
        // independently on first mount and race to seed — that's expected
        // and handled by seed_checkers_board() being a no-op for whoever
        // loses the race (see migration comment), not by turn ownership,
        // since seeding the board isn't a move by either side.
        engine.startGame();
        renderer.syncPieces(engine.board);
        renderTurn(engine.turn);
        supabase.rpc('seed_checkers_board', {
          p_contest_id: contestId,
          p_user_id: myUserId,
          p_board_state: engine.board,
          p_turn: engine.turn,
          p_move_count: engine.moveCount,
        }).then(({ error }) => {
          if (error) console.error('initial board seed failed', error);
        });
      }

      hideOverlay();
    }

    // Applies a board/turn coming from the server (via realtime or initial
    // load) onto the local renderer and rules engine. This is the single
    // place that makes an opponent's move actually appear on screen.
    function applyServerState(updatedContest) {
      console.log('[checkers] applyServerState called', {
        hasEngine: !!engine,
        hasRenderer: !!renderer,
        board_state_type: typeof updatedContest.board_state,
        turn: updatedContest.turn,
        move_count: updatedContest.move_count,
      });

      if (!engine || !renderer) {
        console.warn('[checkers] applyServerState bailed: engine or renderer not mounted yet');
        return;
      }
      if (!updatedContest.board_state) {
        console.warn('[checkers] applyServerState bailed: board_state is falsy', updatedContest.board_state);
        return;
      }

      // Defensive: some client/transport combinations can deliver jsonb
      // columns as a raw string instead of a parsed object. If that's
      // happening, board.length below would be a character count instead
      // of 8, and syncPieces would silently iterate garbage. Parse
      // defensively so we either get a working board or a loud error
      // instead of a quietly broken one.
      let board = updatedContest.board_state;
      if (typeof board === 'string') {
        console.warn('[checkers] board_state arrived as a string, parsing JSON');
        try {
          board = JSON.parse(board);
        } catch (e) {
          console.error('[checkers] failed to parse board_state string', e);
          return;
        }
      }

      try {
        engine.board = board;
        engine.turn  = updatedContest.turn || 'black';
        engine.moveCount = updatedContest.move_count || 0;
        engine.status = 'playing';

        renderer.syncPieces(engine.board);
        renderTurn(engine.turn);
        renderer.clearSelection();
        selected = null;
        moveInFlight = false;
        console.log('[checkers] applyServerState applied successfully, turn is now', engine.turn);
      } catch (e) {
        console.error('[checkers] applyServerState threw while applying board', e);
      }
    }

    function handleGameOver(data) {
      engine.status = 'ended';
      const iWon = data.winner && data.winner === myPlayer?.color;
      const isDraw = !data.winner;
      showOverlay(
        isDraw ? "It's a draw!" : iWon ? 'You win! 🏆' : 'You lose',
        (data.reason || '').replace('-', ' '),
        true,
      );
    }

    // ── Picking: shared logic for mouse click and touch tap ─────────────
    function handlePick(clientX, clientY) {
      if (!engine || !renderer || engine.status !== 'playing') return;
      if (moveInFlight) return; // already waiting on a move RPC round-trip
      if (engine.turn !== myPlayer?.color) { toast("It's not your turn"); return; }

      const hit = renderer.pick(clientX, clientY);
      if (!hit) return;

      if (hit.type === 'hint' && selected) {
        submitMove(selected, { row: hit.row, col: hit.col });
        return;
      }

      if (hit.type === 'piece') {
        if (hit.color !== myPlayer?.color) { toast("That's not your piece"); return; }
        selected = { row: hit.row, col: hit.col };
        renderer.selectPiece(hit.row, hit.col);
        renderer.showHints(engine.movesFor(hit.row, hit.col));
        return;
      }

      // Tapped an empty/light tile — deselect
      renderer.clearSelection();
      selected = null;
    }

    // Validates the move locally against the rules engine, applies it
    // in-engine to compute the resulting board, then persists that result
    // via make_checkers_move(). We don't touch the rendered board here at
    // all — the render only ever updates once the server's realtime UPDATE
    // comes back through applyServerState(), so both players always end up
    // looking at the exact same state instead of the mover's tab racing
    // ahead of what's actually been saved.
    async function submitMove(from, to) {
      const legal = engine.allLegalMoves();
      const match = legal.find(m =>
        m.from.row === from.row && m.from.col === from.col &&
        m.to.row   === to.row   && m.to.col   === to.col
      );
      if (!match) { toast('Illegal move'); return; }

      moveInFlight = true;
      renderer.clearSelection();
      selected = null;

      let overReason = null;
      engine.bus.once('game:over', (data) => { overReason = data.reason; });

      const ok = engine.move(from, to);
      if (!ok) { moveInFlight = false; return; }

      // Optimistic render: show the move immediately on the mover's own
      // screen rather than waiting for the realtime round-trip, so it
      // doesn't feel laggy. This is safe because handlePick already blocks
      // further input while moveInFlight is true, and if the server
      // rejects the move below we explicitly roll the picture back via
      // applyServerState(). The opponent's screen still only updates once
      // the server write lands — this optimism is purely local.
      renderer.syncPieces(engine.board);
      renderTurn(engine.turn);

      // engine.move() may leave us mid multi-jump (status stays 'playing',
      // same turn) — that's fine, we just persist whatever state the
      // engine landed in. _endTurn() inside move() already set
      // engine.status/engine.winner synchronously if the game just ended.
      const turnAfter = engine.turn;
      const boardAfter = engine.snapshot.board;
      const moveCountAfter = engine.moveCount;
      const isGameOver = engine.status === 'ended';

      let winnerId = null;
      if (isGameOver && engine.winner) {
        winnerId = engine.winner === myPlayer?.color ? myPlayer?.user_id : oppPlayer?.user_id;
      }

      console.log('[checkers] submitting move via RPC', { from, to, turnAfter, moveCountAfter, isGameOver });

      const { data, error } = await supabase.rpc('make_checkers_move', {
        p_contest_id: contestId,
        p_user_id: myUserId,
        p_board_state: boardAfter,
        p_turn: turnAfter,
        p_move_count: moveCountAfter,
        p_game_over: isGameOver,
        p_winner_id: winnerId,
      });

      if (error || data !== 'ok') {
        // Someone else's move (or a stale local board) beat us to it.
        // Re-load the authoritative contest row and snap back to it
        // instead of leaving the player stuck on a board that diverged
        // from the server.
        console.error('[checkers] make_checkers_move failed', error, data);
        toast(data === 'not_your_turn' ? "It's not your turn" : 'Move failed — syncing…');
        await loadContestAndPlayers();
        if (contest.board_state) applyServerState(contest);
        moveInFlight = false;
        return;
      }

      console.log('[checkers] make_checkers_move succeeded', data);

      if (isGameOver) handleGameOver({ winner: engine.winner, reason: overReason });
      // moveInFlight is cleared by applyServerState() once our own realtime
      // UPDATE round-trips back to us.
    }

    canvas.addEventListener('click', (e) => handlePick(e.clientX, e.clientY));

    // Touch: tap-to-select / tap-to-move. We avoid treating a drag/pinch
    // as a tap by checking movement distance between touchstart and touchend.
    let touchStartX = 0, touchStartY = 0, touchMoved = false;
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchMoved = false;
    }, { passive: true });
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;
      if (Math.hypot(dx, dy) > 12) touchMoved = true;
    }, { passive: true });
    canvas.addEventListener('touchend', (e) => {
      if (touchMoved) return; // was a drag/scroll gesture, not a tap
      const t = e.changedTouches[0];
      if (t) handlePick(t.clientX, t.clientY);
      e.preventDefault();
    }, { passive: false });

    // ── Realtime updates ──────────────────────────────────────────────
    console.log('[checkers] subscribing to contest-room-' + contestId, 'as user', myUserId);

    const channel = supabase
      .channel(`contest-room-${contestId}`)
      .on('postgres_changes',
        { event: 'UPDATE', schema: 'public', table: 'checkers_contests', filter: `id=eq.${contestId}` },
        async (payload) => {
          console.log('[checkers] realtime UPDATE received', payload.new);
          try {
            contest = payload.new;
            renderHeader();

            // Someone left. If it wasn't me, surface a clear message —
            // this fires even if I'm mid-game, so stop the board from
            // accepting further input.
            if (contest.forfeited_by && contest.forfeited_by !== myUserId && !hasLeftOrEnded) {
              hasLeftOrEnded = true;
              if (engine) engine.status = 'ended'; // stop accepting picks
              if (contest.status === 'cancelled') {
                showOverlay('Match cancelled', 'The host left before the match started.', true);
              } else {
                const iWon = contest.winner_id === myUserId;
                showOverlay(
                  iWon ? 'Opponent left — you win! 🏆' : 'Match ended',
                  iWon ? 'The pot has been credited to your wallet.' : 'Your opponent forfeited the match.',
                  true,
                );
              }
              return;
            }

            // Normal game-over via complete_checkers_contest (not a forfeit) —
            // this is the realtime path for the player who did NOT just make
            // the winning move locally (they already showed the overlay
            // themselves inside submitMove's handleGameOver call).
            if (contest.status === 'completed' && !hasLeftOrEnded) {
              hasLeftOrEnded = true;
              if (engine) engine.status = 'ended';
              if (contest.board_state) {
                renderer?.syncPieces(contest.board_state);
              }
              const iWon = contest.winner_id === myUserId;
              const isDraw = !contest.winner_id;
              showOverlay(
                isDraw ? "It's a draw!" : iWon ? 'You win! 🏆' : 'You lose',
                '',
                true,
              );
              return;
            }

            if (contest.status === 'open' || contest.status === 'cancelled' || contest.status === 'completed') {
              console.log('[checkers] UPDATE ignored, status is', contest.status);
              return;
            }

            if (!engine) {
              // First transition into booked/in_progress for this tab.
              console.log('[checkers] engine not mounted yet, mounting now');
              await loadContestAndPlayers();
              renderHeader();
              mountEngine();
            } else {
              // Engine already mounted — this UPDATE is a move (ours or the
              // opponent's). Apply the server's board/turn directly; this is
              // the line that actually fixes moves not showing up on the
              // other player's screen.
              applyServerState(contest);
            }
          } catch (e) {
            console.error('[checkers] realtime UPDATE handler threw', e);
          }
        })
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'checkers_contest_players', filter: `contest_id=eq.${contestId}` },
        async () => {
          await loadContestAndPlayers();
          renderHeader();
          mountEngine();
        })
      .subscribe((status, err) => {
        console.log('[checkers] realtime channel status:', status, err || '');
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
          console.error('[checkers] realtime subscription problem — moves will not sync:', status, err);
          toast('Connection issue — moves may not sync. Try reloading.');
        }
      });

    window.addEventListener('beforeunload', () => {
      supabase.removeChannel(channel);
      if (renderer) renderer.destroy();
    });

    // ── Boot ────────────────────────────────────────────────────────────
    (async function boot() {
      await loadContestAndPlayers();
      if (!contest) {
        showOverlay('Contest not found', 'This match may have ended or the link is invalid.', true);
        return;
      }
      renderHeader();
      if (contest.status === 'open') {
        showOverlay('Waiting for opponent…', `Share room code ${contest.room_code}`, false);
      } else if (contest.status === 'cancelled') {
        hasLeftOrEnded = true;
        showOverlay('Match cancelled', 'This match was cancelled before it started.', true);
      } else if (contest.status === 'completed') {
        hasLeftOrEnded = true;
        const iWon = contest.winner_id === myUserId;
        const isDraw = !contest.winner_id;
        showOverlay(
          contest.forfeited_by
            ? (iWon ? 'Opponent left — you won! 🏆' : 'Match ended')
            : (isDraw ? "It's a draw!" : iWon ? 'You won! 🏆' : 'You lost'),
          contest.forfeited_by ? 'This match ended by forfeit.' : 'This match has already finished.',
          true,
        );
      } else {
        mountEngine();
      }
    })();
  </script>
</body>
</html>
